set -g mouse on
set -s extended-keys on
set -g extended-keys-format csi-u
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# fix for dragging selection with mouse ending with end of bufffer
bind-key -T copy-mode-vi MouseDrag1Pane \
  select-pane \; \
  send-keys -X scroll-exit-off \; \
  send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi Escape \
  send-keys -X cancel

# Duskfox theme
set -g status-style "bg=#191726,fg=#cdcbe0"
set -g status-left-style "fg=#c4a7e7,bold"
set -g status-right-style "fg=#9ccfd8"
set -g window-status-style "fg=#6e6a86"
set -g window-status-current-style "bg=#2d2a45,fg=#9ccfd8,bold"
set -g window-status-activity-style "fg=#f6c177,bold"
set -g window-status-bell-style "fg=#eb6f92,bold"
set -g pane-border-style "fg=#4b4673"
set -g pane-active-border-style "fg=#569fba"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#f6c177"
set -g message-style "bg=#2d2a45,fg=#e0def4"
set -g message-command-style "bg=#2d2a45,fg=#9ccfd8"
set -g mode-style "bg=#63577d,fg=#eae8ff"
set -g clock-mode-colour "#c4a7e7"

# Save and restore sessions manually with prefix + Ctrl-s / Ctrl-r.
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# Save sessions every 15 minutes and restore when the tmux server starts.
set -g @continuum-restore 'on'
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
