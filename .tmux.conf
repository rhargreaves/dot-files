set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Enable mouse support
set -g mouse on

# Enable OSC 52 clipboard integration
set -s set-clipboard on

#----------------------------------
# Selection & Copy Mode Bindings
#----------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Linux Clipboard
if-shell '[ $(uname) = "Linux" ]' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -sel clip -i'; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -sel clip -i'"

# macOS Clipboard
if-shell '[ $(uname) = "Darwin" ]' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'"

#----------------------------------
# Vim/tmux Integration
#----------------------------------
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

bind-key -n S-Enter send-keys Escape "[13;2u"

# Duskfox
set -g status-style "bg=#191726,fg=#cdcbe0"
set -g status-left-style "fg=#c4a7e7,bold"
set -g status-right-style "fg=#9ccfd8"
set -g window-status-style "fg=#6e6a86"
set -g window-status-current-style "bg=#2d2a45,fg=#9ccfd8,bold"
set -g window-status-activity-style "fg=#f6c177,bold"
set -g window-status-bell-style "fg=#eb6f92,bold"

set -g pane-border-style "fg=#4b4673"
set -g pane-active-border-style "fg=#569fba"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#f6c177"

set -g message-style "bg=#2d2a45,fg=#e0def4"
set -g message-command-style "bg=#2d2a45,fg=#9ccfd8"
set -g mode-style "bg=#63577d,fg=#eae8ff"
set -g clock-mode-colour "#c4a7e7"
